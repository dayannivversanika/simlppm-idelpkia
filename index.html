  <style>
    :root,
    [data-theme="navy"] {
      --bg-base: #1b2d3f;
      --bg-deep: #132231;
      --bg-surface: rgba(24, 42, 60, 0.76);
      --bg-surface-strong: rgba(19, 34, 49, 0.92);
      --bg-subcard: rgba(255, 255, 255, 0.06);
      --bg-input: rgba(14, 26, 39, 0.72);

      --sand: #e5bc98;
      --sand-hover: #f0cda9;
      --copper: #c88652;
      --copper-deep: #8c4f24;

      --text-primary: #f5efe8;
      --text-secondary: #c5d1dc;
      --text-muted: #8fa3b5;

      --border-soft: rgba(229, 188, 152, 0.22);
      --border-strong: rgba(229, 188, 152, 0.45);
      --rim: inset 0 1px 0 rgba(255, 240, 224, 0.16), inset 0 -1px 0 rgba(0, 0, 0, 0.35);
      --shadow-card: 0 20px 50px -12px rgba(6, 12, 20, 0.55);

      --canvas-bg:
        radial-gradient(circle at 12% 16%, rgba(200, 134, 82, 0.16), transparent 36%),
        radial-gradient(circle at 88% 12%, rgba(229, 188, 152, 0.14), transparent 38%),
        radial-gradient(circle at 82% 85%, rgba(44, 72, 99, 0.55), transparent 45%),
        linear-gradient(145deg, #172737 0%, #22384d 52%, #152433 100%);
    }

    [data-theme="sand"] {
      --bg-base: #f5efe6;
      --bg-deep: #ebe1d3;
      --bg-surface: rgba(255, 252, 247, 0.86);
      --bg-surface-strong: rgba(255, 252, 247, 0.95);
      --bg-subcard: rgba(200, 134, 82, 0.08);
      --bg-input: rgba(255, 255, 255, 0.92);

      --sand: #22384d;
      --sand-hover: #172737;
      --copper: #b6703c;
      --copper-deep: #7a421a;

      --text-primary: #1b2d3f;
      --text-secondary: #43576b;
      --text-muted: #687c8f;

      --border-soft: rgba(34, 56, 77, 0.15);
      --border-strong: rgba(182, 112, 60, 0.40);
      --rim: inset 0 1px 0 rgba(255, 255, 255, 0.9), inset 0 -1px 0 rgba(34, 56, 77, 0.06);
      --shadow-card: 0 16px 38px -10px rgba(27, 45, 63, 0.12);

      --canvas-bg:
        radial-gradient(circle at 15% 15%, rgba(229, 188, 152, 0.35), transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(34, 56, 77, 0.10), transparent 45%),
        linear-gradient(145deg, #f7f1e8 0%, #efe6d8 55%, #f4ede3 100%);
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: var(--canvas-bg);
      background-attachment: fixed;
      color: var(--text-secondary);
      line-height: 1.6;
      font-size: 0.875rem;
      overflow-x: hidden;
      transition: background 0.35s ease, color 0.25s ease;
    }

    h1, h2, h3, h4, h5, h6 {
      color: var(--text-primary);
      font-weight: 700;
    }

    .font-script {
      font-family: 'Sacramento', cursive;
      font-weight: 400;
      letter-spacing: 0.5px;
    }

    .editorial-card {
      position: relative;
      background: var(--bg-surface);
      backdrop-filter: blur(18px) saturate(150%);
      -webkit-backdrop-filter: blur(18px) saturate(150%);
      border-radius: 20px;
      border: 1px solid var(--border-soft);
      box-shadow: var(--shadow-card), var(--rim);
      transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.25s ease;
    }

    .editorial-subcard {
      background: var(--bg-subcard);
      border: 1px solid var(--border-soft);
      border-radius: 14px;
      box-shadow: var(--rim);
    }

    .editorial-header {
      background: var(--bg-surface-strong);
      backdrop-filter: blur(22px) saturate(155%);
      -webkit-backdrop-filter: blur(22px) saturate(155%);
      border-bottom: 1px solid var(--border-soft);
    }

    .editorial-sidebar {
      background: var(--bg-surface-strong);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      border-right: 1px solid var(--border-soft);
    }

    .editorial-modal {
      background: var(--bg-surface-strong);
      backdrop-filter: blur(26px) saturate(165%);
      -webkit-backdrop-filter: blur(26px) saturate(165%);
      border: 1px solid var(--border-strong);
      box-shadow: 0 28px 70px -12px rgba(6, 12, 20, 0.65), var(--rim);
    }

    .btn-sand {
      background: linear-gradient(135deg, var(--sand) 0%, var(--copper) 100%);
      color: #162432;
      font-weight: 700;
      border-radius: 999px;
      box-shadow: 0 10px 24px -6px rgba(200, 134, 82, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.45);
      transition: all 0.2s ease;
      cursor: pointer;
    }
    [data-theme="sand"] .btn-sand {
      background: linear-gradient(135deg, #22384d 0%, #152433 100%);
      color: #f5efe8;
    }
    .btn-sand:hover { transform: translateY(-1px); filter: brightness(1.06); }
    .btn-sand:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .btn-outline-sand {
      background: var(--bg-subcard);
      color: var(--text-primary);
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      font-weight: 600;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .btn-outline-sand:hover {
      background: rgba(229, 188, 152, 0.16);
      border-color: var(--sand);
    }

    .sidebar-nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-secondary);
      transition: all 0.18s ease;
      text-align: left;
      border: 1px solid transparent;
      cursor: pointer;
    }
    .sidebar-nav-item:hover {
      background: rgba(229, 188, 152, 0.12);
      color: var(--text-primary);
      border-color: var(--border-soft);
    }
    .sidebar-nav-item.active {
      background: linear-gradient(135deg, var(--sand) 0%, var(--copper) 100%);
      color: #162432;
      font-weight: 700;
      box-shadow: 0 8px 20px -6px rgba(200, 134, 82, 0.45);
    }
    [data-theme="sand"] .sidebar-nav-item.active {
      background: linear-gradient(135deg, #22384d 0%, #152433 100%);
      color: #f5efe8;
    }
